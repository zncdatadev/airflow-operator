apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: observability
spec:
  steps:
  # 1. Install PostgreSQL and Redis
  - name: install-dependencies
    try:
      - apply:
          file: postgres.yaml
      - apply:
          file: redis.yaml
      - assert:
          file: postgres-assert.yaml

  # 2. Install AirflowCluster
  - name: install-airflow-cluster
    try:
      - apply:
          file: credentials.yaml
      - apply:
          file: cluster.yaml
      - assert:
          file: cluster-assert.yaml
      - assert:
          timeout: 240s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: airflowcluster-observability-webservers-default
              namespace: ($namespace)
            status:
              readyReplicas: 1
      - assert:
          timeout: 240s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: airflowcluster-observability-schedulers-default
              namespace: ($namespace)
            status:
              readyReplicas: 1
      - assert:
          timeout: 240s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: airflowcluster-observability-celeryexecutors-default
              namespace: ($namespace)
            status:
              readyReplicas: 1

  # 3. Verify every role group's metrics Service, not only the backing Pods.
  - name: verify-metrics-connectivity
    try:
      - script:
          timeout: 180s
          bindings:
          - name: NAMESPACE
            value: ($namespace)
          content: |
            set -eu

            for SERVICE in \
              airflowcluster-observability-webservers-default \
              airflowcluster-observability-schedulers-default \
              airflowcluster-observability-celeryexecutors-default; do
              echo "Testing metrics Service: $SERVICE"
              PF_LOG=$(mktemp)
              kubectl port-forward -n "$NAMESPACE" "svc/$SERVICE" 19102:9102 >"$PF_LOG" 2>&1 &
              PF_PID=$!
              trap "kill $PF_PID 2>/dev/null || true" EXIT

              HTTP_CODE=""
              for _ in $(seq 1 30); do
                HTTP_CODE=$(curl -sS --max-time 2 -o /dev/null -w "%{http_code}" http://localhost:19102/metrics || true)
                [ "$HTTP_CODE" = "200" ] && break
                sleep 1
              done
              if [ "$HTTP_CODE" != "200" ]; then
                echo "ERROR: Service $SERVICE metrics endpoint returned HTTP ${HTTP_CODE:-none}"
                cat "$PF_LOG"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi

              METRICS=$(curl -fsS --max-time 5 http://localhost:19102/metrics)
              if ! echo "$METRICS" | grep -q "# TYPE"; then
                echo "ERROR: Service $SERVICE does not expose Prometheus text format"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi
              if ! echo "$METRICS" | grep -q "statsd_exporter_"; then
                echo "ERROR: Service $SERVICE does not expose statsd-exporter metrics"
                kill $PF_PID 2>/dev/null || true
                exit 1
              fi

              METRIC_COUNT=$(echo "$METRICS" | grep -c "^[a-z]" || true)
              echo "Service $SERVICE metrics OK ($METRIC_COUNT samples)"
              kill $PF_PID 2>/dev/null || true
              wait $PF_PID 2>/dev/null || true
              rm -f "$PF_LOG"
              sleep 1
            done

            echo "All three role-group metrics Services verified"

            WEB_PF_LOG=$(mktemp)
            kubectl port-forward -n "$NAMESPACE" \
              svc/airflowcluster-observability-webservers-default \
              18080:8080 >"$WEB_PF_LOG" 2>&1 &
            WEB_PF_PID=$!
            trap "kill $WEB_PF_PID 2>/dev/null || true" EXIT
            WEB_HEALTH=""
            for _ in $(seq 1 30); do
              WEB_HEALTH=$(curl -fsS --max-time 2 http://localhost:18080/health || true)
              echo "$WEB_HEALTH" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"' && break
              sleep 1
            done
            if ! echo "$WEB_HEALTH" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "ERROR: Web Service did not return a healthy Airflow response"
              cat "$WEB_PF_LOG"
              kill $WEB_PF_PID 2>/dev/null || true
              exit 1
            fi
            kill $WEB_PF_PID 2>/dev/null || true
            wait $WEB_PF_PID 2>/dev/null || true
            rm -f "$WEB_PF_LOG"
            echo "Web Service HTTP endpoint verified"

  # 4. Install Prometheus
  - name: install-prometheus
    try:
      - script:
          timeout: 420s
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -ex

            echo "=== Environment Check ==="
            echo "NAMESPACE variable: '$NAMESPACE'"
            echo "NAMESPACE length: ${#NAMESPACE}"
            if [ -z "$NAMESPACE" ]; then
              echo "ERROR: NAMESPACE is empty!"
              exit 1
            fi

            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
            helm repo update

            echo "=== Installing Prometheus ==="
            echo "Will install to namespace: $NAMESPACE"

            helm upgrade --install prometheus prometheus-community/prometheus \
              --version 25.3.1 \
              --namespace "$NAMESPACE" \
              --create-namespace \
              -f prometheus-values.yaml \
              --wait --timeout 5m
    # The chart owns cluster-scoped RBAC. Deleting the random Chainsaw namespace
    # alone leaves those objects behind and makes the next run fail Helm's
    # release-namespace ownership check.
    cleanup:
      - script:
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            helm uninstall prometheus --namespace "$NAMESPACE" --wait --timeout 2m 2>/dev/null || true
            # Reclaim interrupted-run leftovers even if the namespaced Helm
            # release record has already disappeared.
            kubectl delete clusterrole prometheus-server --ignore-not-found=true
            kubectl delete clusterrolebinding prometheus-server --ignore-not-found=true

  # 5. Verify Prometheus targets
  - name: verify-prometheus-targets
    try:
      - script:
          timeout: 360s
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            set -eu

            # The pinned chart uses app.kubernetes.io labels; wait on its stable Deployment name
            # rather than the pre-25.x legacy pod selector.
            kubectl rollout status deployment/prometheus-server -n "$NAMESPACE" --timeout=300s

            # Port-forward
            kubectl port-forward -n "$NAMESPACE" svc/prometheus-server 9090:80 > /dev/null 2>&1 &
            PF_PID=$!
            trap "kill $PF_PID 2>/dev/null || true" EXIT

            TARGETS_FILE=$(mktemp)
            READY=false
            for _ in $(seq 1 60); do
              if curl -fsS --max-time 5 http://localhost:9090/api/v1/targets >"$TARGETS_FILE" &&
                python3 - "$TARGETS_FILE" <<'PY'
            import json
            import sys

            expected = [
                "airflowcluster-observability-webservers-default",
                "airflowcluster-observability-schedulers-default",
                "airflowcluster-observability-celeryexecutors-default",
            ]
            with open(sys.argv[1], encoding="utf-8") as stream:
                targets = json.load(stream).get("data", {}).get("activeTargets", [])

            failed = False
            for service in expected:
                matches = [
                    target for target in targets
                    if target.get("labels", {}).get("service") == service
                    or target.get("discoveredLabels", {}).get("__meta_kubernetes_service_name") == service
                ]
                health = [target.get("health", "unknown") for target in matches]
                if not matches:
                    print(f"missing Prometheus target for {service}", file=sys.stderr)
                    failed = True
                elif "up" not in health:
                    print(f"Prometheus target for {service} is not UP: {health}", file=sys.stderr)
                    failed = True

            raise SystemExit(1 if failed else 0)
            PY
              then
                READY=true
                break
              fi
              sleep 3
            done

            if [ "$READY" != "true" ]; then
              echo "ERROR: all three Airflow Prometheus targets did not become UP"
              cat "$TARGETS_FILE"
              exit 1
            fi
            rm -f "$TARGETS_FILE"
            echo "All three Airflow Prometheus targets are UP"

  # 6. Verify metrics scraping
  - name: verify-metrics-scraping
    try:
      - script:
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -e

            # Port-forward to Prometheus
            kubectl port-forward -n "$NAMESPACE" svc/prometheus-server 9090:80 > /dev/null 2>&1 &
            PF_PID=$!
            sleep 3

            trap "kill $PF_PID 2>/dev/null || true" EXIT

            echo "=== Verifying Metrics Scraping ==="

            # Query for any metrics from Airflow pods
            # Using 'up' metric to check if targets are being scraped
            QUERY='up{job="kubernetes-service-endpoints"}'
            RESULT=$(curl -s -G --data-urlencode "query=${QUERY}" http://localhost:9090/api/v1/query)

            echo "Query result:"
            echo "$RESULT" | head -50

            # Check if we got any results
            RESULT_COUNT=$(echo "$RESULT" | grep -o '"__name__":"up"' | wc -l)
            echo "Found $RESULT_COUNT 'up' metrics"

            if [ "$RESULT_COUNT" -eq 0 ]; then
              echo "ERROR: Prometheus did not return any scraped target metrics"
              exit 1
            fi
            echo "Metrics are being scraped successfully"

            echo "✓ Metrics scraping verification complete"
