apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflowcluster-observability-webservers-default
status:
  availableReplicas: 1
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflowcluster-observability-schedulers-default
status:
  availableReplicas: 1
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflowcluster-observability-celeryexecutors-default
status:
  availableReplicas: 1
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: airflowcluster-observability-webservers-default
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9102"
    prometheus.io/path: "/metrics"
    prometheus.io/scheme: "http"
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9102
      protocol: TCP
      targetPort: 9102
  selector:
    airflow.kubedoop.dev/cluster: airflowcluster-observability
    airflow.kubedoop.dev/role: webservers
    airflow.kubedoop.dev/role-group: default
---
